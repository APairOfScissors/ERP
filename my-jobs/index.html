<!DOCTYPE html>
<html lang="en" data-theme="p3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Jobs — LDW Engineering ERP</title>
<script>window.APP_ROOT='../';(function(){try{var t=localStorage.getItem('ldw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spin"></div>
  <div class="loading-text">Initialising…</div>
</div>

<div class="mobile-topbar" id="mobile-topbar"></div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div id="app-shell">
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="page active" id="page-myjobs">
      <div class="ph"><h1 class="ph-title" id="myjobs-title">My <span>Jobs</span></h1><span class="ph-sub" id="myjobs-sub">Loading…</span></div>
      <div class="toolbar" id="myjobs-admin-toolbar" style="display:none">
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-soft)">Viewing as</span>
        <div class="view-toggle" id="myjobs-engineer-toggle">
          <button class="vt-btn" type="button" data-code="CN">CN</button>
          <button class="vt-btn" type="button" data-code="LM">LM</button>
        </div>
      </div>
      <div id="myjobs-groups"></div>
    </div>
  </main>
</div>
</div>

<div id="toasts"></div>

<script src="../shared/core.js"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/ui.js"></script>
<script src="my-jobs.js"></script>
</body>
</html>

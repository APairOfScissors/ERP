<!DOCTYPE html>
<html lang="en" data-theme="p3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph Email Test — LDW Engineering ERP</title>
<script>window.APP_ROOT='../';(function(){try{var t=localStorage.getItem('ldw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spin"></div>
  <div class="loading-text">Initialising…</div>
</div>

<div id="test-panel" style="display:none;max-width:600px;margin:60px auto;padding:32px;background:var(--surface);border:1px solid var(--rule);border-radius:12px">
  <h1 style="font-size:18px;margin-bottom:6px">Graph Email Test</h1>
  <p style="color:var(--text-soft);font-size:12.5px;margin-bottom:20px;line-height:1.6">
    Generates a real invoice PDF from the fields below (same template/PDF pipeline Invoicing uses)
    and emails it via Graph — entirely made-up data, no job/client/invoice_data/invoice_log row is
    ever touched.
  </p>

  <div class="form-grid">
    <div class="field"><label>Send to</label><input type="email" id="test-recipient" placeholder="you@example.com"></div>
    <div class="field"><label>Invoice No</label><input type="text" id="test-invno" value="INV TEST-0001"></div>
    <div class="field"><label>Job No</label><input type="text" id="test-jobno" value="TEST001"></div>
    <div class="field"><label>Revision</label><input type="text" id="test-rev" value="01"></div>
    <div class="field span2"><label>Client Name</label><input type="text" id="test-client" value="Test Client Pty Ltd"></div>
    <div class="field span2"><label>Client Address</label><input type="text" id="test-address" value="123 Test Street, Testville VIC 3000"></div>

    <div class="field span2">
      <label>Line Items</label>
      <table style="width:100%;border-collapse:collapse;margin-top:6px">
        <thead><tr>
          <th style="text-align:left;font-size:10px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text-soft);padding:0 0 6px;font-weight:600">Description</th>
          <th style="width:110px;text-align:left;font-size:10px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--text-soft);padding:0 0 6px 8px;font-weight:600">Amount</th>
          <th style="width:26px"></th>
        </tr></thead>
        <tbody id="test-lines"></tbody>
      </table>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <button type="button" class="btn btn-ghost btn-sm" id="test-addline">+ Add Line</button>
        <span style="font-family:'DM Mono',monospace;font-size:13px;font-weight:700">Total&nbsp; <span id="test-total" style="color:var(--invoicing-txt)">A$ 0.00</span></span>
      </div>
    </div>
  </div>

  <button class="btn btn-primary" id="send-test" style="width:100%;justify-content:center;margin-top:20px">Generate &amp; Send Test Invoice</button>
  <div id="result" style="margin-top:14px;font-size:12px;line-height:1.5"></div>
  <p style="margin-top:18px"><a href="../board/" style="color:var(--text-soft);font-size:11.5px">&larr; Back to Board</a></p>
</div>

<!-- Hidden render target for invoice PDF generation (captured via html2canvas, never shown) -->
<div id="invoice-render" style="position:fixed;left:-9999px;top:0;background:#fff;pointer-events:none"></div>

<div id="toasts"></div>

<script src="../shared/core.js"></script>
<script src="../shared/msal.js"></script>
<script src="../shared/invoice.js"></script>
<script>
// ---- line items ----
function makeTestLineRow(desc, amt) {
  var tr = document.createElement('tr');
  var di = document.createElement('input'); di.type = 'text'; di.value = desc || ''; di.placeholder = 'Description…';
  di.style.cssText = 'width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface2);color:var(--text);font-family:Inter,sans-serif;font-size:13px';
  var ai = document.createElement('input'); ai.type = 'number'; ai.value = amt || ''; ai.step = '0.01'; ai.placeholder = '0.00';
  ai.style.cssText = 'width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--surface2);color:var(--text);font-family:DM Mono,monospace;font-size:13px';
  ai.addEventListener('input', updateTestTotal);
  var rb = document.createElement('button'); rb.type = 'button'; rb.innerHTML = '&#x2715;';
  rb.style.cssText = 'background:none;border:none;cursor:pointer;color:var(--text-soft);font-size:13px;padding:4px';
  rb.addEventListener('click', function(){ tr.remove(); updateTestTotal(); });
  var td1 = document.createElement('td'); td1.style.cssText = 'padding:3px 4px 3px 0'; td1.appendChild(di);
  var td2 = document.createElement('td'); td2.style.cssText = 'padding:3px 0 3px 4px'; td2.appendChild(ai);
  var td3 = document.createElement('td'); td3.style.cssText = 'text-align:center'; td3.appendChild(rb);
  tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
  return tr;
}
function updateTestTotal() {
  var total = 0;
  document.querySelectorAll('#test-lines input[type=number]').forEach(function(i){ total += parseFloat(i.value) || 0; });
  document.getElementById('test-total').textContent = 'A$ ' + total.toFixed(2);
}
function getTestLines() {
  var items = [];
  document.querySelectorAll('#test-lines tr').forEach(function(tr){
    var inputs = tr.querySelectorAll('input');
    if (inputs.length >= 2 && inputs[0].value.trim()) items.push({ desc: inputs[0].value.trim(), amt: parseFloat(inputs[1].value) || 0 });
  });
  return items;
}

(async function() {
  var user = await requireAuth();
  if (!user) return;

  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('test-panel').style.display = 'block';

  // Prefill with the cached Graph account's email as a convenient default, if
  // one's already signed in — doesn't trigger a popup, and stays fully editable.
  try {
    await ensureMsalInit();
    var cached = msalInstance.getAllAccounts()[0];
    if (cached) document.getElementById('test-recipient').value = cached.username;
  } catch (e) {}

  document.getElementById('test-lines').appendChild(makeTestLineRow('Floor Level Survey Drafting', 35));
  document.getElementById('test-lines').appendChild(makeTestLineRow('Floor Plan Drafting', 25));
  updateTestTotal();
  document.getElementById('test-addline').addEventListener('click', function(){
    document.getElementById('test-lines').appendChild(makeTestLineRow('', ''));
  });

  document.getElementById('send-test').addEventListener('click', async function() {
    var btn = this;
    var resultEl = document.getElementById('result');
    var origLabel = btn.innerHTML;
    resultEl.textContent = '';
    try {
      var recipient = document.getElementById('test-recipient').value.trim();
      if (!recipient) throw new Error('Enter an email address to send to');
      var items = getTestLines();
      if (!items.length) throw new Error('Add at least one line item');

      var fakeJob = {
        job_no: document.getElementById('test-jobno').value.trim() || 'TEST001',
        revision: document.getElementById('test-rev').value.trim() || '01'
      };
      var fakeClient = {
        name: document.getElementById('test-client').value.trim() || 'Test Client',
        address: document.getElementById('test-address').value.trim(),
        email_to: recipient,
        email_cc: ''
      };
      var invNo = document.getElementById('test-invno').value.trim() || 'INV TEST-0001';
      var total = items.reduce(function(s,i){ return s + (i.amt||0); }, 0);
      var invDate = new Date();
      var dueDate = new Date(invDate.getTime() + 30 * 86400000);

      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Signing in…';
      var token = await getGraphToken();

      btn.innerHTML = '<span class="spin"></span> Generating PDF…';
      var pdfBase64 = await generateInvoicePdf(fakeJob, fakeClient, invNo, items, total, invDate, dueDate);

      btn.innerHTML = '<span class="spin"></span> Sending…';
      await sendInvoiceEmail(token, fakeJob, fakeClient, invNo, pdfBase64, total);

      resultEl.style.color = 'var(--invoicing-txt)';
      resultEl.textContent = 'Sent "' + invNo + '" (A$ ' + total.toFixed(2) + ') to ' + recipient + ' — check the inbox (and spam).';
      toast('Test invoice sent to ' + recipient, 'ok');
    } catch (err) {
      resultEl.style.color = 'var(--overdue-txt)';
      resultEl.textContent = 'Error: ' + err.message;
      toast('Send failed: ' + err.message, 'err');
    } finally {
      btn.disabled = false; btn.innerHTML = origLabel;
    }
  });
}());
</script>
</body>
</html>

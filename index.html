<!DOCTYPE html>
<html lang="en" data-theme="p3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDW Engineering — ERP</title>
<script>window.APP_ROOT='./';(function(){try{var t=localStorage.getItem('ldw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/app.css">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spin"></div>
  <div class="loading-text">Initialising…</div>
</div>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Lionghardy DesignWorks</div>
    <div class="login-sub">LDW Engineering</div>
    <h1 class="login-title">ERP Console</h1>
    <p class="login-desc">Sign in to access the job management system.</p>
    <div class="login-form">
      <input type="email" id="login-email" placeholder="Email address" autocomplete="email">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="login-btn">Sign In</button>
    </div>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<script src="shared/core.js"></script>
<script>
async function signIn() {
  var email    = document.getElementById('login-email').value.trim();
  var password = document.getElementById('login-password').value;
  var errEl    = document.getElementById('login-error');
  var btn      = document.getElementById('login-btn');
  if (!email || !password) { errEl.textContent = 'Enter email and password'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  var { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { btn.disabled = false; btn.textContent = 'Sign In'; errEl.textContent = error.message; return; }
  location.replace(personCodeOf(data.user) ? 'my-jobs/' : 'board/');
}

function showLogin() {
  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('login-screen').style.display    = 'flex';
}

(async function(){
  document.getElementById('login-btn').addEventListener('click', signIn);
  document.getElementById('login-password').addEventListener('keydown', function(e){ if (e.key === 'Enter') signIn(); });

  var { data: { session } } = await sb.auth.getSession();
  if (session) { location.replace(personCodeOf(session.user) ? 'my-jobs/' : 'board/'); return; }
  showLogin();
}());
</script>
</body>
</html>

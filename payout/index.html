<!DOCTYPE html>
<html lang="en" data-theme="p3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payout — LDW Engineering ERP</title>
<script>window.APP_ROOT='../';(function(){try{var t=localStorage.getItem('ldw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spin"></div>
  <div class="loading-text">Initialising…</div>
</div>

<div class="mobile-topbar" id="mobile-topbar"></div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div id="app-shell">
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="page active" id="page-payout">
      <div class="ph"><h1 class="ph-title">Engineer <span>Payout</span></h1><span class="ph-sub">CN &amp; LM earnings</span><div class="ph-right"><button class="btn btn-ghost btn-sm" id="btn-refresh-payout">&#x21BA; Refresh</button></div></div>
      <div class="stats-row">
        <div class="stat-card"><div class="stat-lbl">CN Unpaid (A$)</div><div class="stat-val blue" id="cn-unpaid-aud">—</div></div>
        <div class="stat-card"><div class="stat-lbl">CN Unpaid (Rp)</div><div class="stat-val" id="cn-unpaid-rp">—</div></div>
        <div class="stat-card"><div class="stat-lbl">LM Unpaid (Rp)</div><div class="stat-val blue" id="lm-unpaid-rp">—</div></div>
        <div class="stat-card"><div class="stat-lbl">LM Total Jobs</div><div class="stat-val" id="lm-total-jobs">—</div></div>
      </div>
      <div class="panel">
        <div class="panel-head" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div style="display:flex;align-items:center;gap:9px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            <h2>Unpaid</h2>
            <div class="view-toggle" id="payout-person-toggle" style="margin-left:6px">
              <button class="vt-btn active" data-person="all">All</button>
              <button class="vt-btn" data-person="CN">CN</button>
              <button class="vt-btn" data-person="LM">LM</button>
            </div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-soft)">CN Rate:</span>
            <input type="number" id="cn-rate" class="rate-input" placeholder="e.g. 16200">
            <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-soft)">Rp/A$</span>
          </div>
        </div>
        <div class="panel-body">
        <div class="table-wrap">
          <table><thead><tr><th>Job</th><th>Rev</th><th>Client</th><th style="text-align:center">E</th><th style="text-align:center">D</th><th style="text-align:center">SV</th><th class="hide-mobile">Note</th><th style="text-align:right">Amount</th><th>Paid</th></tr></thead>
          <tbody id="payout-unpaid-body"></tbody>
          </table>
        </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head" id="payout-paid-head" style="cursor:pointer">
          <span class="chevron" style="display:inline-block;font-size:11px;color:var(--text-soft)">&#9662;</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
          <h2>Paid <span id="payout-paid-count" style="color:var(--text-soft);font-weight:400">(0)</span></h2>
        </div>
        <div class="panel-body" id="payout-paid-panel-body">
        <div class="table-wrap">
          <table><thead><tr><th>Job</th><th>Rev</th><th>Client</th><th style="text-align:center">E</th><th style="text-align:center">D</th><th style="text-align:center">SV</th><th class="hide-mobile">Note</th><th style="text-align:right">Amount</th><th>Paid</th></tr></thead>
          <tbody id="payout-paid-body"></tbody>
          </table>
        </div>
        </div>
      </div>
    </div>
  </main>
</div>
</div>

<!-- PAYOUT AMOUNT MODAL -->
<div class="modal-bg" id="modal-payout-amt">
  <div class="modal" style="max-width:380px">
    <div class="modal-head"><span class="modal-title" id="pm-title">Edit Payout</span><button class="modal-close" id="pm-close">&#x2715;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field" id="pm-fee-field"><label>Fee (A$)</label><input type="number" id="pm-fee" step="0.01" placeholder="0.00"></div>
        <div class="field"><label>Rp</label><input type="number" id="pm-rp" step="1" placeholder="0"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" id="pm-cancel">Cancel</button><button class="btn btn-primary" id="pm-save">Save</button></div>
  </div>
</div>

<div id="toasts"></div>

<script src="../shared/core.js"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/ui.js"></script>
<script src="payout.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="p3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Detail — LDW Engineering ERP</title>
<script>window.APP_ROOT='../';(function(){try{var t=localStorage.getItem('ldw-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/app.css">
</head>
<body>

<div id="loading-overlay">
  <div class="loading-spin"></div>
  <div class="loading-text">Initialising…</div>
</div>

<div class="mobile-topbar" id="mobile-topbar"></div>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<div id="app-shell">
<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="page active" id="page-job">
      <div class="ph">
        <div><h1 class="ph-title" id="job-title">Job <span>Detail</span></h1><span class="ph-sub" id="job-sub">Loading…</span></div>
        <div class="ph-right">
          <button class="btn btn-accent" id="job-onedrive">&#128193; Open in OneDrive</button>
          <a class="btn btn-ghost" href="../board/">&larr; Back to Board</a>
        </div>
      </div>
      <div id="job-body" style="max-width:760px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px"></div>

      <div id="job-upload-section" style="display:none;max-width:760px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:24px;margin-top:16px">
        <div class="detail-section-title">Add Files to OneDrive</div>
        <div class="dropzone" id="job-dropzone">
          <div>Drop files here, or click to browse</div>
          <div style="font-size:11px;margin-top:4px;opacity:.8">Creates this job's OneDrive folder first if it doesn't exist yet — uploads into 01. Architecture/a. Working Docs</div>
          <input type="file" id="job-files" multiple>
        </div>
        <div class="file-chip-list" id="job-file-list"></div>
      </div>
    </div>
  </main>
</div>
</div>

<div id="toasts"></div>

<script src="../shared/core.js"></script>
<script src="../shared/nav.js"></script>
<script src="../shared/msal.js"></script>
<script src="../shared/onedrive.js"></script>
<script src="job.js"></script>
</body>
</html>
